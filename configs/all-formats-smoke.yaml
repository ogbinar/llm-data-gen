version: 2
name: all-formats-source-preserving-v2

input:
  path: ../data/raw/globe-broadband.txt
  language: english
  format: auto
  domain: customer_service

chunking:
  strategy: document
  chunk_size: 2000
  chunk_overlap: 0
  unit: characters

endpoint:
  profile: local-qwen
  base_url: http://127.0.0.1:8080/v1
  model: qwen38-27b-chat-rocmfp4
  timeout_seconds: 120
  temperature: 0.2

generation:
  prompt_pack: all_formats_v2

validation:
  grounding: exact_evidence
  reject_duplicates: true
  require_assistant_final_turn: true

output:
  directory: ../output/globe-broadband-english-source-preserving-v2-r4
  format: jsonl
  resume: true
  include_chunk_text: false
